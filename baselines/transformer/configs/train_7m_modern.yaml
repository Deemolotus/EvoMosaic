# Fair-ish Transformer baseline vs runs/train_modern_moe_attn_v1:
# same modern_v3 data, dialogue packing, assistant-only loss, ~7M params, 8000 steps.
device: rocm
allow_cpu: false
num_threads: 16
seed: 4608

data:
  texts:
    - data/processed/modern_train_v3.txt
  val_texts:
    - data/processed/modern_val_v3.txt
  tokenizer: data/processed/tokenizer_modern_v3.json
  rebuild_tokenizer: false
  max_vocab: 8000
  split_seed: 3307
  pack_mode: dialogue
  assistant_loss_only: true

model:
  arch: transformer_lm
  d_model: 256
  n_layers: 7
  n_heads: 8
  max_seq_len: 160
  mlp_ratio: 4.0
  dropout: 0.0
  tie_embeddings: true

train:
  batch_size: 10
  lr: 0.0008
  min_lr: 0.00008
  weight_decay: 0.015
  steps: 8000
  total_target: 8000
  log_every: 20
  save_every: 0
  eval_every: 500
  eval_batches: 30
  sample_every: 500
  eval_compositional: true
  max_composition_eval: 48
  max_scramble_eval: 48
  num_workers: 0
  pin_memory: true
  out_dir: runs/train_transformer_baseline_v1
